<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>Ranking</title>

		<script type="module" src="/js/bdl--users-ranking.js"></script>

		<link rel="stylesheet" href="/css/main.css" />
		<link rel="stylesheet" href="/css/titles.css" />
		<link rel="stylesheet" href="/css/labels.css" />
		<link rel="stylesheet" href="/css/tables.css" />
		<link rel="stylesheet" href="/css/selects.css" />
		<link rel="stylesheet" href="/css/footers.css" />
	</head>

	<body>
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<div class="page-wrapper">
			<div class="main-content">
				<h2 class="title2">Ranking</h2>

				<div class="label-and-select">
					<label class="label-basic">Time control:</label>
					<select
						class="select-basic"
						id="select-time-control"
						hx-get="/query/html/time-controls-unique"
						hx-trigger="load"
						hx-swap="beforeend"
					>
						<option value=""></option>
					</select>
				</div>

				<div>
					<table class="table-users" id="users-table-with-games">
						<thead>
							<tr>
								<th>Player</th>
								<th>Rating</th>
								<th>Games played</th>
								<th>Won</th>
								<th>Drawn</th>
								<th>Lost</th>
							</tr>
						</thead>
						<tbody></tbody>
					</table>
				</div>

				<div>
					<table class="table-users" id="users-table-without-games">
						<thead>
							<tr>
								<th>Player</th>
								<th>Rating</th>
								<th>Games played</th>
								<th>Won</th>
								<th>Drawn</th>
								<th>Lost</th>
							</tr>
						</thead>
						<tbody></tbody>
					</table>
				</div>
			</div>

			<footer class="footer-copyright-notice">
				Elo chess tracker (v<i hx-get="/version-number" hx-trigger="load"></i>). Code
				<a href="https://github.com/lluisalemanypuig/elo-chess-tracker">online at Github</a>.
			</footer>
		</div>
	</body>
</html>
